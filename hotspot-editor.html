<title>Hotspot Coordinate Editor</title>
<style>
  body { margin: 0; background: #1a2328; color: #fff; font-family: Arial, sans-serif; }

</style>

sY8FOTCNZ6AAAAMycwWWUrKE20sHghAYafRC70JgSkcxEnamaD/lAc93D211843vosb6xuTQlkblSKZHj/jAAAA=" alt="TMJ lateral muscles">
  <svg id="overlay" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
let currentMuscle = null;
let allShapes = {};
const colors = {
  temporalis: '#7CB9E8',
  masseter: '#E8A87C',
  digastric: '#E87C9A'
};

function setMuscle(name) {
  currentMuscle = name;
  if (!allShapes[name]) allShapes[name] = [];
  document.getElementById('current-muscle').textContent = 'Recording: ' + name + ' (' + (allShapes[name].length) + ' points so far)';
  updateDisplay();
}

function clearPoints() {
  if (currentMuscle && allShapes[currentMuscle]) {
    allShapes[currentMuscle].pop();
    updateDisplay();
  }
}

function clearAll() {
  if (currentMuscle) allShapes[currentMuscle] = [];
  updateDisplay();
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (!currentMuscle) { alert('Select a muscle first'); return; }
  const img = document.getElementById('img');
  const rect = img.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * 1536 / rect.width);
  const y = Math.round((e.clientY - rect.top) * 1024 / rect.height);
  allShapes[currentMuscle].push([x, y]);
  document.getElementById('current-muscle').textContent = 'Recording: ' + currentMuscle + ' (' + allShapes[currentMuscle].length + ' points)';
  updateDisplay();
});

function updateDisplay() {
  const pts = currentMuscle && allShapes[currentMuscle] ? allShapes[currentMuscle] : [];
  
  // Build SVG
  const svg = document.getElementById('overlay');
  svg.innerHTML = '';
  
  Object.entries(allShapes).forEach(([name, points]) => {
    if (points.length < 2) {
      points.forEach(p => {
        const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r','10');
        c.setAttribute('fill', colors[name] || '#fff'); c.setAttribute('fill-opacity','0.8');
        svg.appendChild(c);
      });
      return;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = 'M' + points.map(p=>p[0]+' '+p[1]).join(' L') + ' Z';
    path.setAttribute('d', d);
    path.setAttribute('fill', colors[name] || '#fff');
    path.setAttribute('fill-opacity','0.4');
    path.setAttribute('stroke', colors[name] || '#fff');
    path.setAttribute('stroke-width','3');
    svg.appendChild(path);
    
    points.forEach((p,i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r','8');
      c.setAttribute('fill', colors[name]||'#fff'); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','2');
      svg.appendChild(c);
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',p[0]+14); t.setAttribute('y',p[1]+6);
      t.setAttribute('fill','#fff'); t.setAttribute('font-size','22'); t.setAttribute('font-weight','bold');
      t.textContent = i+1;
      svg.appendChild(t);
    });
  });

  // Show path for current muscle
  if (pts.length >= 2) {
    const d = 'M' + pts.map(p=>p[0]+' '+p[1]).join(' L') + ' Z';
    document.getElementById('coords').textContent = d;
  } else {
    document.getElementById('coords').textContent = pts.length + ' point(s) — need at least 2 to form a shape';
  }
  document.getElementById('points').textContent = pts.map((p,i)=>`${i+1}: x=${p[0]}, y=${p[1]}`).join('\n');
}
</script>
